<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوق حسابات فري فاير</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mut:#6b7280;--ac:#ff6a00;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2a2e38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:16px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;background:var(--ac);color:#fff}
button.g{background:var(--bd);color:var(--tx)}button.w{background:#25d366}button:disabled{opacity:.6}
.big{width:100%;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px}
.imgs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.imgs img{height:170px;border-radius:10px;flex:0 0 auto}
.price{color:var(--ac);font-weight:900;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.mut{color:var(--mut);font-size:13px}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:15px}
.thumbs{display:flex;gap:6px;margin-top:8px}.thumbs img{height:70px;border-radius:8px}
.err{color:#dc2626;font-size:14px;margin-top:10px;min-height:18px}
.center{text-align:center;padding:50px 16px}
</style>
</head>
<body>
<header><h1>🔥 سوق حسابات فري فاير</h1><div id="top" class="mut"></div></header>
<main id="app"><div class="center mut">جاري التحميل...</div></main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,push,remove,onValue,get,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDx-klJiA6UWYLxOkjt8WT43Ov6pYuTb8M",
  authDomain:"education-ff3f1.firebaseapp.com",
  databaseURL:"https://education-ff3f1-default-rtdb.firebaseio.com",
  projectId:"education-ff3f1",
  storageBucket:"education-ff3f1.firebasestorage.app",
  messagingSenderId:"933135502252",
  appId:"1:933135502252:web:38aaf32ab7345838fd0809"
};

const app=document.getElementById('app'),top_=document.getElementById('top');
const db=getDatabase(initializeApp(firebaseConfig));
let uid=null,code='',listings=[],unsub=null,photos=[];
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
const errMsg=e=>(e&&e.code==='PERMISSION_DENIED')?'مفيش صلاحية. راجع قواعد Realtime Database':(typeof e==='string'?e:'خطأ: '+(e&&(e.code||e.message)||e));
const hash=async(pw,salt)=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
const save=u=>{try{u?localStorage.setItem('ffUser',JSON.stringify(u)):localStorage.removeItem('ffUser')}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('ffUser'))}catch(e){return null}};

function start(u){
  uid=u.name;code=u.code;
  top_.innerHTML='ID: <b>'+esc(code)+'</b> <button class="g" id="out" style="padding:6px 10px;font-size:12px">خروج</button>';
  document.getElementById('out').onclick=()=>{save(null);if(unsub){unsub();unsub=null}uid=null;top_.innerHTML='';loginView()};
  unsub=onValue(ref(db,'listings'),s=>{
    listings=[];s.forEach(c=>{listings.push({id:c.key,...c.val()})});
    listings.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(document.getElementById('list'))renderList();
  },e=>{app.innerHTML='<div class="center err">'+esc(errMsg(e))+'</div>'});
  home();
}

function loginView(){
  app.innerHTML='<div class="card"><h3 style="margin-top:0">تسجيل الدخول</h3>'+
  '<label>اسم المستخدم (حروف إنجليزي وأرقام)</label><input id="un" dir="ltr" autocapitalize="none">'+
  '<label>الباسورد</label><input id="pw" type="password" dir="ltr">'+
  '<div class="err" id="err"></div>'+
  '<div class="row"><button id="in" style="flex:1">دخول</button><button class="g" id="up" style="flex:1">حساب جديد</button></div></div>';
  const run=signup=>async()=>{
    const err=document.getElementById('err');err.textContent='';
    const name=document.getElementById('un').value.trim().toLowerCase(),pw=document.getElementById('pw').value;
    if(!/^[a-z0-9_]{3,20}$/.test(name)){err.textContent='اسم المستخدم 3 لـ 20 حرف إنجليزي أو رقم';return}
    if(pw.length<6){err.textContent='الباسورد لازم 6 حروف على الأقل';return}
    try{
      const r=ref(db,'users/'+name),snap=await get(r);
      if(signup){
        if(snap.exists()){err.textContent='اسم المستخدم ده موجود';return}
        const salt=rnd(12),u={name,code:rnd(6)};
        await set(r,{salt,hash:await hash(pw,salt),code:u.code,createdAt:Date.now()});
        save(u);start(u);
      }else{
        const d=snap.val();
        if(!d||d.hash!==await hash(pw,d.salt)){err.textContent='اسم المستخدم أو الباسورد غلط';return}
        const u={name,code:d.code};save(u);start(u);
      }
    }catch(e){err.textContent=errMsg(e)}
  };
  document.getElementById('in').onclick=run(false);
  document.getElementById('up').onclick=run(true);
}

function home(){
  app.innerHTML='<button class="big" id="add">➕ إضافة حساب فري فاير</button><div id="list"></div>';
  document.getElementById('add').onclick=form;
  renderList();
}

function renderList(){
  const el=document.getElementById('list');if(!el)return;
  const vis=listings.filter(l=>!l.hidden);
  if(!vis.length){el.innerHTML='<div class="center mut">لسه مفيش حسابات معروضة</div>';return}
  const badge=l=>{const r=l.ai&&l.ai.risk;return r==='low'?'<div class="mut" style="color:#16a34a">✅ اتفحص بالذكاء الاصطناعي</div>':(r==='medium'||r==='high')?'<div class="mut" style="color:#d97706">⚠️ اتأكد من البائع كويس قبل ما تدفع</div>':''};
  const info=l=>{const a=l.ai;if(!a)return'';const d=l.description||a.description;
    return (d?'<div class="mut" style="margin-top:6px">'+esc(d)+'</div>':'')+
    (a.price&&a.price.suggested?'<div class="mut" style="margin-top:6px">💡 السعر العادل المقدّر: '+esc(a.price.min)+' – '+esc(a.price.max)+' ج.م</div>':'')+
    (a.cons&&a.cons.length?'<div class="mut" style="color:#dc2626;margin-top:4px">❌ '+a.cons.map(esc).join(' • ')+'</div>':'')+
    (a.pros&&a.pros.length?'<div class="mut" style="color:#16a34a;margin-top:4px">✅ '+a.pros.map(esc).join(' • ')+'</div>':'')};
  el.innerHTML=vis.map(l=>{
    const wa=String(l.whatsapp||'').replace(/\D/g,'');
    return '<div class="card"><div class="imgs">'+(l.photos||[]).map(p=>'<img src="'+esc(p)+'" alt="">').join('')+'</div>'+
    badge(l)+'<div class="row"><b>'+esc(l.linked)+'</b><span class="price">'+esc(l.price)+' ج.م</span></div>'+info(l)+
    '<div class="row"><span class="mut">البائع ID: '+esc(l.sellerCode)+'</span>'+
    '<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><button class="w">واتساب</button></a></div>'+
    (l.owner===uid?'<div class="row"><button class="g" data-del="'+esc(l.id)+'">🗑️ حذف</button></div>':'')+'</div>';
  }).join('');
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(confirm('تحذف الحساب ده؟'))try{await remove(ref(db,'listings/'+b.dataset.del))}catch(e){alert(errMsg(e))}
  });
}

function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    let w=800,q=.65,out='';const c=document.createElement('canvas');
    for(let i=0;i<6;i++){
      const r=Math.min(1,w/img.width);c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);
      if(out.length<120000)break;w=Math.round(w*.8);q=Math.max(.4,q-.05);
    }
    URL.revokeObjectURL(u);out.length<150000?res(out):rej();
  };
  img.onerror=rej;img.src=u;
})}

function form(){
  photos=[];
  app.innerHTML='<div class="card"><h3 style="margin-top:0">إضافة حساب</h3>'+
  '<label>صور الحساب (حتى 4 صور)</label><input type="file" id="f" accept="image/*" multiple><div class="thumbs" id="th"></div>'+
  '<label>الحساب مربوط بإيه؟ (اسم الحساب في فري فاير أو أي لعبة)</label><input id="linked" maxlength="80">'+
  '<label>سعر الحساب (جنيه)</label><input id="price" type="number" min="0" inputmode="numeric">'+
  '<label>رقم الواتساب للتواصل</label><input id="wa" type="tel" inputmode="tel" dir="ltr" placeholder="2010xxxxxxxx">'+
  '<div class="err" id="err"></div>'+
  '<div class="row"><button id="save" style="flex:1">نشر الحساب</button><button class="g" id="back">رجوع</button></div></div>';
  document.getElementById('back').onclick=home;
  document.getElementById('f').onchange=async e=>{
    photos=[];const th=document.getElementById('th');th.innerHTML='';
    for(const f of [...e.target.files].slice(0,4)){
      try{const d=await compress(f);photos.push(d);th.insertAdjacentHTML('beforeend','<img src="'+d+'" alt="">')}catch(x){}
    }
  };
  document.getElementById('save').onclick=async()=>{
    const err=document.getElementById('err');err.textContent='';
    const linked=document.getElementById('linked').value.trim(),price=Number(document.getElementById('price').value),wa=document.getElementById('wa').value.trim();
    if(!photos.length||!linked||!(price>0)||wa.replace(/\D/g,'').length<8){err.textContent='كمّل كل البيانات وضيف صورة على الأقل';return}
    const b=document.getElementById('save');b.disabled=true;b.textContent='جاري النشر...';
    try{
      await push(ref(db,'listings'),{owner:uid,sellerCode:code,photos,linked,price,whatsapp:wa,createdAt:Date.now()});
      home();
    }catch(e){err.textContent=errMsg(e);b.disabled=false;b.textContent='نشر الحساب'}
  };
}

const u0=load();u0&&u0.name?start(u0):loginView();
</script>
</body>
</html>
